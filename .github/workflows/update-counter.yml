name: Update counter JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # cada 15 minutos

# Grant write permission so the workflow can commit back the generated file
permissions:
  contents: write

jobs:
  fetch-counter:
    runs-on: ubuntu-latest
    # Opt into Node.js 24 for JavaScript actions to avoid deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch counter from API
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        run: |
          echo "Fetching counter..."
          mkdir -p public
          curl -s -H "Authorization: Bearer $API_KEY" \
            https://api.counterapi.dev/v2/daniel-garcias-team-4475/first-counter-4475 \
            -o public/counter.json
          echo "Saved to public/counter.json"

      - name: Deploy `public` to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
