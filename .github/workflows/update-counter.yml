name: Update counter JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 * * * *' # cada 15 minutos

jobs:
  fetch-counter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch counter from API
        env:
          API_KEY: ${{ secrets.COUNTER_API_KEY }}
        run: |
          echo "Fetching counter..."
          mkdir -p public
          curl -s -H "Authorization: Bearer $API_KEY" \
            https://api.counterapi.dev/v2/daniel-garcias-team-4475/first-counter-4475 \
            -o public/counter.json
          echo "Saved to public/counter.json"

      - name: Commit and push counter.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/counter.json
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "chore: update counter.json [skip ci]"
            git push
          fi
